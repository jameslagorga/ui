<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Camera Streams</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body {
            font-family: sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .video-container {
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        .video-wrapper {
            flex: 1;
            border: 1px solid #ccc;
            border-radius: 8px;
            overflow: hidden;
            background-color: #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        video {
            width: 100%;
            height: auto;
            display: block;
        }
        h2 {
            text-align: center;
            margin: 10px 0;
            font-size: 1.2em;
        }
        .image-wrapper {
            flex: 1;
            border: 1px solid #ccc;
            border-radius: 8px;
            overflow: hidden;
            background-color: #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .image-wrapper img {
            width: 100%;
            height: auto;
            display: block;
        }
    </style>
</head>
<body>

    <h1>Live Camera Streams</h1>

    <div class="controls" style="text-align: center; margin-bottom: 20px;">
        <button id="playPauseAllButton" style="padding: 10px 20px; font-size: 1.2em; cursor: pointer;">
            Pause All
        </button>
    </div>

    <div class="video-container">
        <div class="video-wrapper">
            <h2>Camera 0</h2>
            <video id="video-cam-camera_0" controls muted></video>
        </div>
        <div class="video-wrapper">
            <h2>Camera 1</h2>
            <video id="video-cam-camera_1" controls muted></video>
        </div>
        <div class="video-wrapper">
            <h2>Camera 2</h2>
            <video id="video-cam-camera_2" controls muted></video>
        </div>
    </div>

    <div class="frame-publishing-controls" style="text-align: center; margin-top: 20px; padding: 20px; border-top: 2px solid #ccc;">
        <h2>Frame Publishing</h2>
        
        <div style="display: flex; justify-content: space-around; flex-wrap: wrap; gap: 30px; margin-top: 20px;">
            <!-- Stereo Vision Controls -->
            <div style="border: 1px solid #ccc; padding: 20px; border-radius: 8px; background-color: #fff; min-width: 300px;">
                <h3>Stereo Vision Topic</h3>
                <div style="margin: 15px 0;">
                    <p>Status: <span id="stereoStatus">Unknown</span></p>
                    <button id="startStereoContinuous" style="padding: 8px 16px; font-size: 1em; cursor: pointer; margin: 5px;">
                        Start Continuous
                    </button>
                    <button id="stopStereoContinuous" style="padding: 8px 16px; font-size: 1em; cursor: pointer; margin: 5px;">
                        Stop Continuous
                    </button>
                </div>
                <div style="margin: 15px 0;">
                    <button id="sendStereoFrame" style="padding: 8px 16px; font-size: 1em; cursor: pointer; background-color: #2196F3; color: white; margin: 5px;">
                        Send One Frame
                    </button>
                </div>
            </div>

            <!-- Calibration Controls -->
            <div style="border: 1px solid #ccc; padding: 20px; border-radius: 8px; background-color: #fff; min-width: 300px;">
                <h3>Calibration Topic</h3>
                <div id="calibrationCountdown" style="text-align: center; font-size: 1.5em; margin: 10px 0;"></div>
                <div style="margin: 15px 0;">
                    <p>Status: <span id="calibrationStatus">Unknown</span></p>
                    <button id="startCalibrationContinuous" style="padding: 8px 16px; font-size: 1em; cursor: pointer; margin: 5px;">
                        Start Continuous
                    </button>
                    <button id="stopCalibrationContinuous" style="padding: 8px 16px; font-size: 1em; cursor: pointer; margin: 5px;">
                        Stop Continuous
                    </button>
                </div>
                <div style="margin: 15px 0;">
                    <button id="sendCalibrationFrame" style="padding: 8px 16px; font-size: 1em; cursor: pointer; background-color: #FF9800; color: white; margin: 5px;">
                        Send One Frame
                    </button>
                    <button id="runCalibrationButton" style="padding: 8px 16px; font-size: 1em; cursor: pointer; background-color: #4CAF50; color: white; margin: 5px;">
                        Run Calibration
                    </button>
                    <button id="fetchTimestampsButton" style="padding: 8px 16px; font-size: 1em; cursor: pointer; background-color: #f44336; color: white; margin: 5px;">
                        Fetch Timestamps
                    </button>
                </div>
                <div id="timestampsContainer" style="margin-top: 15px; padding: 10px; border: 1px solid #ddd; border-radius: 4px; background-color: #f9f9f9; max-height: 200px; overflow-y: auto;">
                    <!-- Timestamps will be displayed here -->
                </div>
            </div>
        </div>
    </div>

    <div class="offset-controls" style="text-align: center; margin-top: 20px; padding: 20px; border-top: 2px solid #ccc;">
        <h2>Image Frame Synchronization</h2>
        <p>Enter the time offset in milliseconds for each camera to correct for stream delays. Then fetch the synchronized images.</p>
        <div style="text-align: center; margin-bottom: 15px;">
            <label for="offset-all-cameras">Offset (seconds):</label>
            <input type="number" id="offset-all-cameras" value="0" style="width: 100px; padding: 5px;">
        </div>
        <button id="fetch-offset-images" style="padding: 10px 20px; font-size: 1.2em; cursor: pointer;">
            Fetch Synced Images
        </button>
        <div id="offset-images-container" style="display: flex; justify-content: center; gap: 20px; margin-top: 20px;">
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (!Hls.isSupported()) {
                console.error("HLS.js is not supported.");
                return;
            }

            const cameraIds = ["camera_0", "camera_1", "camera_2"];
            const baseStreamUrl = 'http://binocular.lagorgeo.us/streams/hls/';
            const playerPromises = [];
            const players = new Map(); // Store { video: HTMLVideoElement, hls: Hls }

            const playPauseAllButton = document.getElementById('playPauseAllButton');
            const startPublisherButton = document.getElementById('startPublisherButton');
            const stopPublisherButton = document.getElementById('stopPublisherButton');
            const publisherStatus = document.getElementById('publisherStatus');
            let isPlaying = true; // Assume playing after initial sync

            const urlParams = new URLSearchParams(window.location.search);
            const streamName = urlParams.get('stream') || 'live-stream'; // Get from URL, or default

            if (streamName === 'default-stream') {
                console.warn("No 'stream' parameter found in URL. Defaulting to 'default-stream'. Please use ?stream=<your-stream-name> in the URL.");
            }

            cameraIds.forEach(id => {
                const videoId = `video-cam-${id}`;
                const streamKey = id;
                const video = document.getElementById(videoId);

                if (video) {
                    const hls = new Hls({ liveSyncDurationCount: 3, liveMaxLatencyDurationCount: 5 });
                    const streamUrl = `${baseStreamUrl}${streamKey}/playlist.m3u8`;

                    hls.loadSource(streamUrl);
                    hls.attachMedia(video);

                    players.set(videoId, { video, hls });

                    const playerReadyPromise = new Promise(resolve => {
                        hls.on(Hls.Events.MANIFEST_PARSED, () => {
                            console.log(`${videoId} manifest parsed.`);
                            resolve();
                        });
                        hls.on(Hls.Events.ERROR, (event, data) => {
                            console.error(`${videoId} HLS.js error:`, data);
                            resolve(); 
                        });
                    });
                    playerPromises.push(playerReadyPromise);
                }
            });

            Promise.all(playerPromises)
                .then(() => {
                    console.log("All player manifests parsed. Proceeding to sync.");

                    const leaderPlayer = players.get(`video-cam-${cameraIds[0].replace(/0x/g, '')}`);
                    if (!leaderPlayer || !leaderPlayer.hls.liveSyncPosition) {
                        console.error("Leader player not ready or liveSyncPosition not available.");
                        return;
                    }

                    let syncTime = leaderPlayer.hls.liveSyncPosition - 10;
                    if (syncTime < 0) {
                        console.warn("Calculated sync time is negative. Setting to 0.");
                        syncTime = 0;
                    }

                    console.log(`--- SYNC POINT ACQUIRED: ${syncTime} ---`);
                    console.log("Commanding all players to seek and play.");

                    players.forEach(player => {
                        player.video.currentTime = syncTime;
                        player.video.play().catch(e => {
                            console.error(`Failed to play ${player.video.id}:`, e);
                            if (e.name === 'NotAllowedError' || e.name === 'AbortError') {
                                console.warn(`Attempting to play ${player.video.id} again after error.`);
                                player.video.muted = true; 
                                player.video.play().catch(retryErr => console.error(`Retry play failed for ${player.video.id}:`, retryErr));
                            }
                        });
                    });

                    // Add event listener for the Play/Pause All button
                    playPauseAllButton.addEventListener('click', () => {
                        if (isPlaying) {
                            players.forEach(player => player.video.pause());
                            playPauseAllButton.textContent = 'Play All';
                        } else {
                            players.forEach(player => player.video.play().catch(e => console.error(`Failed to play ${player.video.id}:`, e)));
                            playPauseAllButton.textContent = 'Pause All';
                        }
                        isPlaying = !isPlaying;
                    });
                })
                .catch(error => {
                    console.error("Error during player initialization or sync:", error);
                });
            
            // Frame publishing controls
            const stereoStatus = document.getElementById('stereoStatus');
            const calibrationStatus = document.getElementById('calibrationStatus');
            const startStereoContinuous = document.getElementById('startStereoContinuous');
            const stopStereoContinuous = document.getElementById('stopStereoContinuous');
            const sendStereoFrame = document.getElementById('sendStereoFrame');
            const startCalibrationContinuous = document.getElementById('startCalibrationContinuous');
            const stopCalibrationContinuous = document.getElementById('stopCalibrationContinuous');
            const sendCalibrationFrame = document.getElementById('sendCalibrationFrame');
            const calibrationCountdown = document.getElementById('calibrationCountdown');

            const stereoTopic = 'stereo-vision-topic';
            const calibrationTopic = 'calibration-topic';
            const publisherBaseUrl = '/api/publisher';

            async function updateTopicStatus(topic, statusElement) {
                try {
                    const response = await fetch(`${publisherBaseUrl}/streams/${topic}`);
                    const data = await response.json();
                    statusElement.textContent = data.status;
                } catch (error) {
                    console.error(`Error getting ${topic} status:`, error);
                    statusElement.textContent = 'Error';
                }
            }

            // Stereo Vision Controls
            startStereoContinuous.addEventListener('click', async () => {
                try {
                    const response = await fetch(`${publisherBaseUrl}/streams/${stereoTopic}`, { method: 'PUT' });
                    if (response.ok) {
                        updateTopicStatus(stereoTopic, stereoStatus);
                    } else {
                        const error = await response.json();
                        alert(`Error: ${error.error || 'Failed to start stereo publisher'}`);
                    }
                } catch (error) {
                    console.error('Error starting stereo publisher:', error);
                    alert('Error starting stereo publisher');
                }
            });

            stopStereoContinuous.addEventListener('click', async () => {
                try {
                    const response = await fetch(`${publisherBaseUrl}/streams/${stereoTopic}`, { method: 'DELETE' });
                    if (response.ok) {
                        updateTopicStatus(stereoTopic, stereoStatus);
                    } else {
                        const error = await response.json();
                        alert(`Error: ${error.error || 'Failed to stop stereo publisher'}`);
                    }
                } catch (error) {
                    console.error('Error stopping stereo publisher:', error);
                    alert('Error stopping stereo publisher');
                }
            });

            sendStereoFrame.addEventListener('click', async () => {
                try {
                    const timestamp = Date.now();
                    const response = await fetch(`${publisherBaseUrl}/frames/${stereoTopic}`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ timestamp: timestamp })
                    });
                    if (response.ok) {
                        // Frame sent successfully
                    } else {
                        const error = await response.json();
                        alert(`Error: ${error.error || 'Failed to send frame'}`);
                    }
                } catch (error) {
                    console.error('Error sending stereo frame:', error);
                    alert('Error sending stereo frame');
                }
            });

            // Calibration Controls
            startCalibrationContinuous.addEventListener('click', async () => {
                try {
                    const response = await fetch(`${publisherBaseUrl}/streams/${calibrationTopic}`, { method: 'PUT' });
                    if (response.ok) {
                        updateTopicStatus(calibrationTopic, calibrationStatus);
                        
                        let totalCaptures = 20;
                        let captureCount = 0;

                        function startCaptureCycle() {
                            if (captureCount >= totalCaptures) {
                                calibrationCountdown.textContent = 'Calibration sequence finished.';
                                return;
                            }
                            
                            captureCount++;
                            let countdown = 5;
                            
                            function updateCountdown() {
                                if (countdown >= 1) {
                                    calibrationCountdown.textContent = `Capture ${captureCount}/${totalCaptures} in: ${countdown}`;
                                    countdown--;
                                    setTimeout(updateCountdown, 1000);
                                } else {
                                    calibrationCountdown.textContent = ``;
                                    setTimeout(startCaptureCycle, 1000); // wait 1 second before next cycle
                                }
                            }
                            updateCountdown();
                        }

                        startCaptureCycle();

                    } else {
                        const error = await response.json();
                        alert(`Error: ${error.error || 'Failed to start calibration publisher'}`);
                    }
                } catch (error) {
                    console.error('Error starting calibration publisher:', error);
                    alert('Error starting calibration publisher');
                }
            });

            stopCalibrationContinuous.addEventListener('click', async () => {
                try {
                    const response = await fetch(`${publisherBaseUrl}/streams/${calibrationTopic}`, { method: 'DELETE' });
                    if (response.ok) {
                        updateTopicStatus(calibrationTopic, calibrationStatus);
                    } else {
                        const error = await response.json();
                        alert(`Error: ${error.error || 'Failed to stop calibration publisher'}`);
                    }
                } catch (error) {
                    console.error('Error stopping calibration publisher:', error);
                    alert('Error stopping calibration publisher');
                }
            });

            sendCalibrationFrame.addEventListener('click', async () => {
                try {
                    const timestamp = Date.now();
                    const response = await fetch(`${publisherBaseUrl}/frames/${calibrationTopic}`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ timestamp: timestamp })
                    });
                    if (response.ok) {
                        // Frame sent successfully
                    } else {
                        const error = await response.json();
                        alert(`Error: ${error.error || 'Failed to send frame'}`);
                    }
                } catch (error) {
                    console.error('Error sending calibration frame:', error);
                    alert('Error sending calibration frame');
                }
            });

            // Run Calibration Button
            const runCalibrationButton = document.getElementById('runCalibrationButton');
            runCalibrationButton.addEventListener('click', async () => {
                try {
                    const response = await fetch('/api/calibration/calibrate', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        }
                    });
                    const data = await response.json();
                    if (response.ok) {
                        alert(`Calibration started: ${data.message}. Timestamp count: ${data.timestamp_count}`);
                    } else {
                        alert(`Error starting calibration: ${data.error || response.statusText}`);
                    }
                } catch (error) {
                    console.error('Error running calibration:', error);
                    alert('Error running calibration.');
                }
            });

            // Fetch Timestamps Button
            const fetchTimestampsButton = document.getElementById('fetchTimestampsButton');
            const timestampsContainer = document.getElementById('timestampsContainer');
            fetchTimestampsButton.addEventListener('click', async () => {
                try {
                    const response = await fetch('/api/calibration/timestamps');
                    const data = await response.json();
                    if (response.ok) {
                        timestampsContainer.innerHTML = '<h3>Timestamps:</h3>';
                        if (data.timestamps && data.timestamps.length > 0) {
                            const list = document.createElement('ul');
                            data.timestamps.forEach(ts => {
                                const listItem = document.createElement('li');
                                listItem.textContent = ts;
                                list.appendChild(listItem);
                            });
                            timestampsContainer.appendChild(list);
                        } else {
                            timestampsContainer.innerHTML += '<p>No timestamps in the queue.</p>';
                        }
                    } else {
                        timestampsContainer.innerHTML = `<p>Error fetching timestamps: ${data.error || response.statusText}</p>`;
                    }
                } catch (error) {
                    console.error('Error fetching timestamps:', error);
                    timestampsContainer.innerHTML = '<p>Error fetching timestamps.</p>';
                }
            });

            // Initial status check and periodic updates
            updateTopicStatus(stereoTopic, stereoStatus);
            updateTopicStatus(calibrationTopic, calibrationStatus);
            setInterval(() => {
                updateTopicStatus(stereoTopic, stereoStatus);
                updateTopicStatus(calibrationTopic, calibrationStatus);
            }, 5000);

            const fetchOffsetImagesButton = document.getElementById('fetch-offset-images');
            const offsetImagesContainer = document.getElementById('offset-images-container');
            const offsetAllCamerasInput = document.getElementById('offset-all-cameras');

            fetchOffsetImagesButton.addEventListener('click', () => {
                const now = Date.now();
                offsetImagesContainer.innerHTML = ''; // Clear previous images
                const globalOffsetSeconds = parseFloat(offsetAllCamerasInput.value) || 0;
                const globalOffsetMilliseconds = globalOffsetSeconds * 1000;

                cameraIds.forEach((id) => {
                    const targetTimestamp = now - globalOffsetMilliseconds;
                    const streamKey = id;
                    const imageUrl = `http://binocular.lagorgeo.us/mjpeg/image/${streamKey}/${targetTimestamp}`;

                    const wrapper = document.createElement('div');
                    wrapper.className = 'image-wrapper';

                    const title = document.createElement('h3');
                    const cameraIndex = id.split('_')[1];
                    title.textContent = `Camera ${cameraIndex} (Timestamp: ${targetTimestamp})`;
                    title.style.textAlign = 'center';
                    title.style.margin = '10px 0';
                    title.style.fontSize = '1.2em';


                    const img = document.createElement('img');
                    img.src = imageUrl;

                    img.onerror = () => {
                        img.alt = `Error loading image for Camera ${id}.`;
                        console.error(`Error loading image from URL: ${imageUrl}`);
                    };

                    wrapper.appendChild(title);
                    wrapper.appendChild(img);
                    offsetImagesContainer.appendChild(wrapper);
                });
            });
        });
    </script>
</body>
</html>
